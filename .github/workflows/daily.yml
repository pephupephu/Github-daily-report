name: daily report + email
on:
  schedule:
    - cron: "17 1 * * *"   # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    # 同一时间只允许一个运行；改成排队不互杀，避免连点/并发把正在跑的运行杀掉导致前功尽弃
    concurrency:
      group: daily-report
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 装 Playwright 浏览器（抓中文入口 + 截图）
        # 用项目自带的 playwright-core 装浏览器，版本与 article.mjs 的 import("playwright-core") 严格一致
        # （不能 npx playwright install，它会装最新 CLI 的浏览器版本，导致 headless shell 版本错位、launch 崩）
        # 网络不稳时 headless shell 可能下载失败，重试到装出为止；若最终仍缺，article.mjs 会降级成纯 HTTP 英雄图继续出稿
        run: |
          for i in 1 2 3; do
            npx playwright-core install chromium && break
            echo "浏览器下载第 $i 次失败，重试"
            sleep 10
          done
          npx playwright-core install --list 2>/dev/null || true

      - name: 生成报告
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.ANALYSIS_API_KEY }}
          OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
          OPENAI_API_KEY_3: ${{ secrets.OPENAI_API_KEY_3 }}
          OPENAI_API_KEY_4: ${{ secrets.OPENAI_API_KEY_4 }}
          OPENAI_API_KEY_5: ${{ secrets.OPENAI_API_KEY_5 }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'glm-4.7-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node trending.mjs daily

      - name: 生成文章初稿
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.ANALYSIS_API_KEY }}
          OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
          OPENAI_API_KEY_3: ${{ secrets.OPENAI_API_KEY_3 }}
          OPENAI_API_KEY_4: ${{ secrets.OPENAI_API_KEY_4 }}
          OPENAI_API_KEY_5: ${{ secrets.OPENAI_API_KEY_5 }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'glm-4.7-flash' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node article.mjs

      - name: 提交报告
        run: |
          git config user.name  "report-bot"
          git config user.email "actions@github.com"
          git add reports out
          # 内容和上次一样就跳过，别让空提交把整个 job 变成失败
          if git diff --staged --quiet; then echo "报告无变化，跳过提交"; exit 0; fi
          git commit -q -m "report: $(date -u +%F)"
          # 定时任务和本地推送会撞车，必须 rebase 后再推，否则 non-fast-forward
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "推送失败，重试 $i/3"; sleep 5; git pull --rebase --autostash origin main
          done
          # 邮件已经发成功了，仓库归档是次要的；失败只警告，不让整个 job 变红
          echo "::warning::报告已生成并发信成功，但归档到仓库失败，需手动处理"