name: daily report + email
on:
  schedule:
    - cron: "17 1 * * *"   # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 生成报告
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node trending.mjs daily

      - name: 生成文章初稿
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node article.mjs

      - name: 发送到邮箱
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node mail.mjs

      - name: 提交报告
        run: |
          git config user.name  "report-bot"
          git config user.email "actions@github.com"
          git add reports out
          # 内容和上次一样就跳过，别让空提交把整个 job 变成失败
          if git diff --staged --quiet; then echo "报告无变化，跳过提交"; exit 0; fi
          git commit -q -m "report: $(date -u +%F)"
          # 定时任务和本地推送会撞车，必须 rebase 后再推，否则 non-fast-forward
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "推送失败，重试 $i/3"; sleep 5; git pull --rebase --autostash origin main
          done
          # 邮件已经发成功了，仓库归档是次要的；失败只警告，不让整个 job 变红
          echo "::warning::报告已生成并发信成功，但归档到仓库失败，需手动处理"